name: Deploy HumanMesh email MFA function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy email-mfa Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets." && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Add SUPABASE_PROJECT_REF in GitHub Actions secrets." && exit 1)
      - name: Deploy email-mfa function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy email-mfa --project-ref "$SUPABASE_PROJECT_REF"
